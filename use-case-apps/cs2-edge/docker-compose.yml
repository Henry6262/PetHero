services:
  postgres:
    image: postgres:16-alpine
    container_name: cs2-edge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cs2_edge_live
    ports:
      - "5432:5432"
    volumes:
      - cs2_edge_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cs2_edge_live"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cs2_edge_postgres_data:
