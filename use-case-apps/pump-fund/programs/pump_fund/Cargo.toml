[package]
name = "pump-fund"
version = "0.1.0"
description = "Pump.fun token launcher with GoFundMe-style campaigns and on-chain donor rewards"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pump_fund"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["metadata"] }
