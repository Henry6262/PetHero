[workspace]
members = ["programs/*"]
resolver = "2"

# Patch anchor-syn so idl-build works with the newer proc-macro2 semver-exempt API.
[patch.crates-io]
anchor-syn = { path = "vendor/anchor-syn" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
