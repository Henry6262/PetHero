<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="position:relative;display:flex;align-items:center;gap:17px;background:{{ cardBg }};border:1px solid transparent;box-shadow:{{ cardShadow }};backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);border-radius:22px;padding:27px 20px;cursor:pointer;overflow:hidden">
<div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:{{ accent }};box-shadow:0 0 14px {{ accent }}"></div>
<div style="width:50px;height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:{{ accent }}" data-om-raster>{{ icon }}</div>
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:center;gap:9px"><span style="font:800 23px Inter;color:var(--text);letter-spacing:.01em">{{ title }}</span><sc-if value="{{ restricted }}" hint-placeholder-val="{{ false }}"><span style="font:700 8px 'Space Grotesk';letter-spacing:.12em;color:var(--alert);border:1px solid color-mix(in srgb,var(--alert) 55%,transparent);background:color-mix(in srgb,var(--alert) 14%,transparent);border-radius:5px;padding:2px 5px">RESTRICTED</span></sc-if></div>
<sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}"><div style="font:500 15.5px Inter;color:var(--muted);margin-top:5px;line-height:1.35">{{ subtitle }}</div></sc-if>
</div>
<svg width="9" height="15" viewBox="0 0 9 15" style="flex-shrink:0"><path d="M1 1l6 6.5-6 6.5" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:108},&quot;iconName&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;recon&quot;,&quot;rescue&quot;,&quot;eliminate&quot;,&quot;bolt&quot;,&quot;route&quot;],&quot;default&quot;:&quot;recon&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Recon&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Secure the building&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#18C0CE&quot;,&quot;options&quot;:[&quot;#18C0CE&quot;,&quot;#2FB873&quot;,&quot;#FF4D4D&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;restricted&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  _icon(name, col) {
    const R = React.createElement;
    const svg = (ch) => R('svg', { width: '100%', height: '100%', viewBox: '0 0 24 24', fill: 'none' }, ch);
    if (name === 'recon') return svg([
      R('path', { key: 'a', d: 'M3 9h18v2.6a4.6 4.6 0 0 1-4.6 4.6h-1a2.6 2.6 0 0 1-2.5-1.9l-.2-.7a1 1 0 0 0-1.9 0l-.2.7A2.6 2.6 0 0 1 8.1 16.2h-1A4.6 4.6 0 0 1 2.5 11.6V9z', stroke: col, strokeWidth: 1.7, strokeLinejoin: 'round' }),
      R('path', { key: 'b', d: 'M5 9V7.5A1.5 1.5 0 0 1 6.5 6M19 9V7.5A1.5 1.5 0 0 0 17.5 6', stroke: col, strokeWidth: 1.5, strokeLinecap: 'round' }),
      R('circle', { key: 'c', cx: 7.8, cy: 11.7, r: 1.15, fill: col }),
      R('circle', { key: 'd', cx: 16.2, cy: 11.7, r: 1.15, fill: col })
    ]);
    if (name === 'rescue') return svg([
      R('circle', { key: 'a', cx: 6.4, cy: 6.6, r: 2.3, stroke: col, strokeWidth: 1.55 }),
      R('path', { key: 'b', d: 'M2.5 18.4v-.7a3.9 3.9 0 0 1 7.8 0v.7', stroke: col, strokeWidth: 1.55, strokeLinecap: 'round' }),
      R('circle', { key: 'c', cx: 17.6, cy: 6.6, r: 2.3, stroke: col, strokeWidth: 1.55 }),
      R('path', { key: 'd', d: 'M13.7 18.4v-.7a3.9 3.9 0 0 1 7.8 0v.7', stroke: col, strokeWidth: 1.55, strokeLinecap: 'round' }),
      R('circle', { key: 'e', cx: 12, cy: 11, r: 1.95, stroke: col, strokeWidth: 1.55 }),
      R('path', { key: 'f', d: 'M8.7 20.4v-.6a3.3 3.3 0 0 1 6.6 0v.6', stroke: col, strokeWidth: 1.55, strokeLinecap: 'round' })
    ]);
    if (name === 'eliminate') return svg([
      R('circle', { key: 'a', cx: 12, cy: 12, r: 8, stroke: col, strokeWidth: 1.7 }),
      R('path', { key: 'b', d: 'M12 2v4M12 18v4M2 12h4M18 12h4', stroke: col, strokeWidth: 1.7, strokeLinecap: 'round' }),
      R('circle', { key: 'c', cx: 12, cy: 12, r: 2, fill: col })
    ]);
    if (name === 'bolt') return svg([
      R('path', { key: 'a', d: 'M13 2L4 14h6l-1 8 9-12h-6z', fill: col })
    ]);
    if (name === 'route') return svg([
      R('circle', { key: 'a', cx: 5.5, cy: 6, r: 2.4, stroke: col, strokeWidth: 1.8 }),
      R('circle', { key: 'b', cx: 18.5, cy: 18, r: 2.4, stroke: col, strokeWidth: 1.8 }),
      R('path', { key: 'c', d: 'M8 6h6.5a3 3 0 0 1 0 6h-5a3 3 0 0 0 0 6H16', stroke: col, strokeWidth: 1.8, strokeLinecap: 'round' })
    ]);
    return null;
  }
  renderVals() {
    const p = this.props;
    const accent = p.accent || '#18C0CE';
    const dark = p.dark !== false;
    const fill = dark
      ? 'linear-gradient(105deg, color-mix(in srgb,' + accent + ' 44%, #0a0c10) 0%, color-mix(in srgb,' + accent + ' 12%, #0b0d11) 42%, #0b0d11 82%)'
      : 'linear-gradient(105deg, color-mix(in srgb,' + accent + ' 30%, #ffffff) 0%, color-mix(in srgb,' + accent + ' 9%, #ffffff) 44%, #ffffff 82%)';
    const borderGrad = 'linear-gradient(105deg, color-mix(in srgb,' + accent + ' 78%, transparent) 0%, color-mix(in srgb,' + accent + ' 26%, transparent) 42%, transparent 78%)';
    return {
      icon: this._icon(p.iconName, accent),
      title: p.title || '', subtitle: p.subtitle || '', hasSub: !!p.subtitle, restricted: !!p.restricted,
      onClick: p.onClick,
      accent,
      cardBg: fill + ' padding-box, ' + borderGrad + ' border-box',
      cardShadow: dark
        ? 'inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 26px rgba(0,0,0,0.38)'
        : 'inset 0 1px 0 rgba(255,255,255,0.6), 0 8px 22px rgba(20,22,27,0.10)'
    };
  }
}
</script>
</body>
</html>
