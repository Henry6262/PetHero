<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreetRivalz</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a12; }
      #app { width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 16px; bottom: 16px; color: #fff;
        font-family: ui-monospace, monospace; font-size: 16px; user-select: none;
        text-shadow: 0 1px 3px rgba(0,0,0,.8);
      }
      #drift-bar { width: 140px; height: 8px; background: #ffffff22; border-radius: 4px; margin-top: 6px; }
      #drift-fill { height: 100%; width: 0%; background: #4ade80; border-radius: 4px; }
      #garage {
        position: fixed; inset: 0; display: none;
        background: rgba(10,10,18,0.92); color: #fff;
        font-family: ui-monospace, monospace; padding: 24px;
        overflow-y: auto; user-select: none;
      }
      #garage h2 { margin: 0 0 12px; }
      #garage .section { margin-bottom: 16px; }
      #garage .items { display: flex; flex-wrap: wrap; gap: 8px; }
      #garage .item {
        padding: 8px 12px; background: #ffffff15; border-radius: 6px; cursor: pointer;
        border: 2px solid transparent;
      }
      #garage .item:hover { background: #ffffff25; }
      #garage .item.equipped { border-color: #4ade80; }
      #garage button { margin-top: 12px; padding: 8px 16px; background: #4ade80; color: #000; border: none; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="position">1/6</div>
      <div id="speed">0 km/h</div>
      <div id="lap">LAP 1/3</div>
      <div id="item">-</div>
      <div id="drift-bar"><div id="drift-fill"></div></div>
    </div>
    <div id="garage">
      <h2>GARAGE <span style="font-size:14px;color:#888">(G to close)</span></h2>
      <div id="garage-content"></div>
      <button id="garage-save">SAVE LOADOUT</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
